name: Jacobsthal compatibility candidate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Git dependencies and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Restore prior source-layout artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            vendor/PrimeNumberTheoremAnd/.lake/build
            vendor/AbsorptionCutoff/.lake/build
            external/StrongPNT/.lake/build
          key: jac435-legacy-layout-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jac435-
      - name: Migrate prior support-package artifacts
        shell: bash
        run: |
          set -euo pipefail
          for package in PrimeNumberTheoremAnd AbsorptionCutoff; do
            if [ -d "vendor/$package/.lake/build" ]; then
              mkdir -p ".lake/packages/$package/.lake/build"
              cp -a "vendor/$package/.lake/build/." ".lake/packages/$package/.lake/build/"
            fi
          done
          if [ -d external/StrongPNT/.lake/build ]; then
            mkdir -p .lake/packages/StrongPNT/.lake/build
            cp -a external/StrongPNT/.lake/build/. .lake/packages/StrongPNT/.lake/build/
          fi
      - name: Restore incremental proof artifacts
        id: proof-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/AbsorptionCutoff/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: jac435-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('provenance.json', 'OAI/**/*.lean', 'vendor/**/*.lean', 'patches/*.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jac435-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('provenance.json', 'OAI/**/*.lean', 'vendor/**/*.lean', 'patches/*.patch') }}-
            jac435-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            jac435-
      - name: Build both complete closed theorem closures
        run: lake --wfail build OAI.NumberTheory.Jacobsthal.Main Audit
      - name: Audit both actual closed theorem dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -j2 -DwarningAsError=true Audit.lean | tee axiom-report.txt
          grep -F "'OAI.Erdos970.Erdos970Final.erdos_970_quadratic' depends on axioms: [propext, Classical.choice, Quot.sound]" axiom-report.txt
          grep -F "'OAI.Erdos970.Erdos970Final.erdos_970_iterated_log' depends on axioms: [propext, Classical.choice, Quot.sound]" axiom-report.txt
          ! grep -E 'sorryAx|trustCompiler|ofReduceBool' axiom-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axiom-report
          path: axiom-report.txt
          if-no-files-found: ignore
      - name: Preserve incremental proof artifacts after success or failure
        if: always() && steps.proof-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/AbsorptionCutoff/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: ${{ steps.proof-cache.outputs.cache-primary-key }}
